services:
  - type: web
    name: pearler-beads-studio
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_NAME
        value: Perler Beads Studio
      - key: BOOKING_EMAIL
        value: bookings@perlerbeadsstudio.example
