databases:
  - name: perler-beads-db
    plan: free
    databaseName: perler_beads_studio
    postgresMajorVersion: "17"

services:
  - type: web
    name: pearler-beads-studio
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Perler Beads Studio
      - key: BOOKING_EMAIL
        value: bookings@perlerbeadsstudio.example
      - key: PUBLIC_APP_URL
        value: https://perler-studio-web-app.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: perler-beads-db
          property: connectionString
